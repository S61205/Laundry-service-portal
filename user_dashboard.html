<!DOCTYPE html>

<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard</title>

<style>

body{
font-family:Arial;
margin:0;
background:#f5f7fb
}

.header{
background:linear-gradient(90deg,#4f46e5,#06b6d4);
padding:18px;
text-align:center;
color:#fff;
font-weight:700
}

/* DASHBOARD CARDS */

.cards{
display:flex;
justify-content:center;
gap:20px;
margin-top:40px;
flex-wrap:wrap;
}

.card{
width:200px;
padding:25px;
background:#fff;
border-radius:10px;
box-shadow:0 6px 18px rgba(0,0,0,0.1);
text-align:center;
cursor:pointer;
transition:0.2s;
font-weight:bold;
}

.card:hover{
transform:translateY(-5px);
box-shadow:0 10px 25px rgba(0,0,0,0.15);
}

/* SMALL LOGOUT BUTTON */

.logout{
display:block;
margin:30px auto;
background:#ef4444;
color:#fff;
border:none;
padding:8px 18px;
border-radius:6px;
font-weight:bold;
cursor:pointer;
width:auto;
}

.logout:hover{
background:#dc2626;
}

/* BOOKING FORM */

.container{
padding:40px;
max-width:760px;
margin:40px auto;
background:#fff;
border-radius:8px;
display:none;
}

select,input,button{
padding:10px;
border-radius:6px;
margin:6px 0;
width:100%
}

button{
background:#4f46e5;
color:#fff;
border:none
}

/* BACK LINK */

.backlink{
margin-top:10px;
display:block;
text-align:right;
}

/* Cloth rows */

.row{
display:flex;
gap:10px;
margin-bottom:10px
}

.row select{
flex:2
}

.row input{
flex:1
}

</style>

</head>

<body>

{% with messages = get_flashed_messages() %}
{% if messages %}
{% for message in messages %}

<script>alert("{{ message }}");</script>

{% endfor %}
{% endif %}
{% endwith %}

<div class="header">
<h1>LAUNDRY SERVICE PORTAL</h1>
</div>

<!-- DASHBOARD CARDS -->

<div class="cards">

<div class="card" onclick="openBooking()">
Booking
</div>

<div class="card" onclick="window.location='/my_bookings'">
My Bookings
</div>

<div class="card" onclick="window.location='/employees'">
Employees
</div>

</div>

<button class="logout" onclick="window.location='/logout'">Logout</button>

<!-- BOOKING FORM -->

<div class="container" id="bookingForm">

<h2>Book Service</h2>

<form method="POST" action="/book">

<label>Category</label>

<select name="category" required>
{% for c in categories %}
<option value="{{c.id}}">{{c.name}}</option>
{% endfor %}
</select>

<h3>Select Clothes</h3>

<div id="clothRows">

<div class="row">

<select name="cloth[]" required onchange="calculateTotal()">

{% for c in clothes %}

<option value="{{c.id}}" data-price="{{c.price}}">
{{c.cloth_name}} - ₹{{c.price}}
</option>

{% endfor %}

</select>

<input type="number" name="qty[]" placeholder="Quantity" required oninput="calculateTotal()">

</div>

</div>

<button type="button" onclick="addRow()">Add More Clothes</button>

<p style="font-weight:bold;margin-top:10px;">
Total Cost: ₹ <span id="total">0</span>
</p>

<label>Pickup Date</label> <input name="date" type="date" required>

<button>Book</button>

</form>

<div class="backlink">
<a href="/dashboard">Back</a>
</div>

</div>

<script>

function openBooking(){
document.querySelector(".cards").style.display="none";
document.querySelector(".logout").style.display="none";
document.getElementById("bookingForm").style.display="block";
}

function addRow(){

let container = document.getElementById("clothRows");

let row = document.createElement("div");
row.className = "row";

row.innerHTML = `
<select name="cloth[]" onchange="calculateTotal()" required>

{% for c in clothes %}

<option value="{{c.id}}" data-price="{{c.price}}">
{{c.cloth_name}} - ₹{{c.price}}
</option>

{% endfor %}

</select>

<input type="number" name="qty[]" placeholder="Quantity" oninput="calculateTotal()" required>
`;

container.appendChild(row);

}


function calculateTotal(){

let rows = document.querySelectorAll("#clothRows .row");

let total = 0;

rows.forEach(function(row){

let cloth = row.querySelector("select");
let qty = row.querySelector("input").value;

let price = cloth.options[cloth.selectedIndex].dataset.price;

if(qty === ""){
qty = 0;
}

total += price * qty;

});

document.getElementById("total").innerText = total;

}

</script>

</body>
</html>
