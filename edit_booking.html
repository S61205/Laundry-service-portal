<!DOCTYPE html>

<html>
<head>
<meta charset="utf-8">
<title>Edit Booking</title>

<style>
body{
font-family:Arial;
background:#f5f7fb;
padding:20px
}

.card{
max-width:700px;
margin:auto;
background:#fff;
padding:20px;
border-radius:8px
}

select,input,button{
width:100%;
padding:10px;
margin:8px 0;
border-radius:6px;
border:1px solid #ddd
}

button{
background:#4f46e5;
color:#fff;
border:none;
cursor:pointer
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px
}

th,td{
border:1px solid #eee;
padding:8px;
text-align:left
}

th{
background:#f1f5f9
}
</style>

</head>

<body>

{% with messages = get_flashed_messages() %}
{% if messages %}
{% for message in messages %}

<script>
alert("{{ message }}");
</script>

{% endfor %}
{% endif %}
{% endwith %}

<div class="card">

<h3>Edit Booking #{{b.id}}</h3>

<form method="POST" action="/update_booking_user/{{b.id}}">

<label>Category</label> <select name="category" required>
{% for c in categories %}

<option value="{{c.id}}" {% if c.id==b.category_id %}selected{% endif %}>
{{c.name}}
</option>
{% endfor %}
</select>

<label>Pickup Date</label> <input type="date" name="date" value="{{b.date}}" required>

<h3>Clothes</h3>

<table>
<tr>
<th>Cloth</th>
<th>Quantity</th>
</tr>

{% if items %}
    {% for i in items %}
    <tr>

        <td>
        <select name="cloth[]">
            {% for c in clothes %}
            <option value="{{c.id}}" {% if c.id == i.cloth_id %}selected{% endif %}>
                {{c.cloth_name}}
            </option>
            {% endfor %}
        </select>
        </td>

        <td>
        <input type="number" name="qty[]" value="{{i.quantity}}" min="1">
        </td>

    </tr>
    {% endfor %}

{% else %}
<tr>
<td>
<select name="cloth[]">
{% for c in clothes %}
<option value="{{c.id}}">{{c.cloth_name}}</option>
{% endfor %}
</select>
</td>

<td>
<input type="number" name="qty[]" min="1" value="1">
</td>
</tr>
{% endif %}

</table>

<br>

<button type="submit">Update Booking</button>

</form>

<p><a href="/my_bookings">⟵ Back</a></p>

</div>

</body>
</html>
